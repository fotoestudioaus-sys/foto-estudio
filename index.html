  ${visiblePhotos.length ? visiblePhotos.map(p=>`
    <div class="thumb-row">
      <img src="${normalizeImageUrl(p.url) || p.url}" alt="" style="filter:${cssFilterFor(p)}">
      <div class="thumb-meta">
        <div class="cap">${escapeHtml(p.caption||'(sin descripción)')}</div>
      </div>
      <div class="thumb-actions">
        <a class="icon-btn" href="${normalizeImageUrl(p.url) || p.url}" download target="_blank" rel="noopener" title="Descargar / abrir">⭳</a>
        <button class="icon-btn" data-action="edit-photo" data-scope="gallery" data-gallery-id="${g.id}" data-id="${p.id}" title="Editar y retocar">✎</button>
        <button class="icon-btn danger" onclick="window.__deleteGalleryPhoto('${g.id}','${p.id}')" title="Eliminar">✕</button>
      </div>
    </div>
  `).join('') : '<p class="hint">Esta galería todavía no tiene fotos.</p>'}

  ${remaining > 0 ? `<button class="btn-ghost" style="margin-top:14px; width:100%;" onclick="window.__loadMoreGalleryPhotos('${g.id}')">Cargar ${Math.min(remaining, GALLERY_PAGE_SIZE)} más (quedan ${remaining})</button>` : ''}
  `;
}

window.__addGalleryPhoto = async function(id){
  const urlsInput = document.getElementById('gp-urls-'+id);
  const fileInput = document.getElementById('gp-file-'+id);
  const urlsRaw = urlsInput.value.split('\n').map(l=>l.trim()).filter(Boolean);
  const files = Array.from(fileInput.files || []);
  if(!urlsRaw.length && !files.length){ alert('Pega al menos una liga o selecciona al menos un archivo.'); return; }

  const g = state.galleries.find(g=>g.id===id);
  if(!g) return;

  let added = 0;
  for(const raw of urlsRaw){
    g.photos.push({ id: uid(), url: normalizeImageUrl(raw), caption: '', adjust: {...DEFAULT_ADJUST} });
    added++;
  }
  const up = await uploadFilesWithProgress(files, ['EstudioFoto', 'Galerías', g.name]);
  if(up === null) return;
  up.items.forEach(it => { g.photos.push({ id: uid(), url: it.url, caption: '', adjust: {...DEFAULT_ADJUST} }); added++; });

  render(); // al instante, en la vista que corresponda (lista o detalle)
  if(files.length){
    await saveAndFinish(()=>STORAGE.set('gallery:'+id, g, true, true), added, up.failed, up.expired);
  } else {
    STORAGE.set('gallery:'+id, g);
  }
};
window.__deleteGalleryPhoto = function(galleryId, photoId){
  const g = state.galleries.find(g=>g.id===galleryId);
  if(!g) return;
  g.photos = g.photos.filter(p=>p.id!==photoId);
  render();
  STORAGE.set('gallery:'+galleryId, g);
};
window.__extendGallery = function(id){
  const g = state.galleries.find(g=>g.id===id);
  if(!g) return;
  g.expiresAt = addMonths(new Date(g.expiresAt), 3).toISOString();
  render();
  STORAGE.set('gallery:'+id, g);
};
window.__deleteGallery = function(id){
  if(!confirm('¿Eliminar esta galería? Esta acción no se puede deshacer.')) return;
  state.galleries = state.galleries.filter(g=>g.id!==id);
  if(state.galleryDetailId === id) state.galleryDetailId = null; // si la estabas viendo, regresa a la lista
  render();
  (async ()=>{
    await STORAGE.delete('gallery:'+id);
    const idx = (await STORAGE.get('galleries:index')) || [];
    await STORAGE.set('galleries:index', idx.filter(x=>x!==id));
  })();
};

/* ---------------------------- DESCARGA DE FOTOS (galería de cliente) ---------------------------- */
/* Para fotos de Drive se usa el enlace de descarga del archivo ORIGINAL (no la miniatura de 2000 px). */
function originalDownloadUrl(url){
  if(url && url.includes('drive.google.com')){
    const id = fileIdFromDriveUrl(url);
    if(id) return `https://drive.usercontent.google.com/download?id=${id}&export=download`;
  }
  return url;
}
function triggerDownload(photo, index){
  const url = originalDownloadUrl(photo.url);
  if(!url) return;
  if(url.startsWith('data:')){
    const a = document.createElement('a');
    a.href = url; a.download = `foto-${String(index+1).padStart(3,'0')}.jpg`;
    document.body.appendChild(a); a.click(); a.remove();
  } else {
    // iframe oculto: el servidor responde "attachment" y el navegador descarga sin abrir pestañas
    const f = document.createElement('iframe');
    f.style.display = 'none'; f.src = url;
    document.body.appendChild(f);
    setTimeout(()=> f.remove(), 60000);
  }
}
window.__downloadOnePhoto = function(idx){
  const p = state.galleryData && state.galleryData.photos[idx];
  if(p) triggerDownload(p, idx);
};
let downloadingAll = false;
window.__downloadAllPhotos = async function(){
  if(downloadingAll || !state.galleryData) return;
  const photos = state.galleryData.photos;
  if(!photos.length) return;
  if(!confirm(`Se descargarán ${photos.length} fotografía(s) en su tamaño original, una tras otra. Puede tardar unos minutos y tu navegador podría pedir permiso para descargas múltiples. ¿Continuar?`)) return;
  downloadingAll = true;
  const btn = document.getElementById('dl-all-btn');
  const status = document.getElementById('dl-all-status');
  if(btn) btn.disabled = true;
  for(let i=0; i<photos.length; i++){
    triggerDownload(photos[i], i);
    if(status) status.textContent = `Descargando ${i+1} de ${photos.length}… no cierres esta pestaña.`;
    await new Promise(r=>setTimeout(r, 1500)); // pausa para que el navegador no bloquee las descargas
  }
  if(status) status.textContent = `Listo: se iniciaron ${photos.length} descargas. Revisa tu carpeta de Descargas.`;
  if(btn) btn.disabled = false;
  downloadingAll = false;
};

/* ---- Descarga en ZIP ----
   Las fotos de Drive pasan por el backend (Google bloquea leerlas directo desde el
   navegador). Se arman ZIPs de hasta ZIP_CHUNK fotos para no saturar la memoria
   del dispositivo del cliente. */
const ZIP_CHUNK = 20;
function b64ToUint8(b64){
  const bin = atob(b64); const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return arr;
}
function extFromMime(m){
  if(!m) return 'jpg';
  if(m.includes('png')) return 'png';
  if(m.includes('webp')) return 'webp';
  if(m.includes('gif')) return 'gif';
  return 'jpg';
}
async function fetchPhotoBytes(photo){
  const url = photo.url || '';
  if(url.startsWith('data:')){
    const m = url.match(/^data:([^;]+);base64,(.*)$/);
    if(m) return { bytes: b64ToUint8(m[2]), ext: extFromMime(m[1]) };
    throw new Error('formato no soportado');
  }
  if(url.includes('drive.google.com')){
    const id = fileIdFromDriveUrl(url);
    if(!id) throw new Error('liga de Drive sin ID');
    const res = await fetch(API_URL, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'fetchPhoto', fileId: id, secret: APP_SECRET })
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    return { bytes: b64ToUint8(data.base64), ext: extFromMime(data.mime) };
  }
  const res = await fetch(url); // otras URLs: solo funciona si el sitio permite CORS
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const blob = await res.blob();
  return { bytes: new Uint8Array(await blob.arrayBuffer()), ext: extFromMime(blob.type) };
}
function showZipOverlay(){
  let el = document.getElementById('zip-overlay');
  if(el) return el;
  el = document.createElement('div');
  el.id = 'zip-overlay'; el.className = 'zip-overlay';
  el.innerHTML = `<div class="zip-box">
    <div class="zip-spinner" id="zip-spinner"></div>
    <h3 id="zip-title">Preparando tu descarga…</h3>
    <p><strong>Por favor espera, esto puede tardar unos minutos.</strong></p>
    <p>No cierres ni cambies de pestaña hasta que termine.</p>
    <div class="zip-bar"><div id="zip-bar-fill"></div></div>
    <p id="zip-detail" style="font-family:var(--f-mono); font-size:12px;"></p>
    <button class="btn" id="zip-close" style="display:none; margin-top:14px;" onclick="document.getElementById('zip-overlay').remove()">Cerrar</button>
  </div>`;
  document.body.appendChild(el);
  return el;
}
function updateZipOverlay(detail, pct){
  const d = document.getElementById('zip-detail'); if(d) d.textContent = detail;
  const b = document.getElementById('zip-bar-fill'); if(b && pct!==undefined) b.style.width = Math.round(pct) + '%';
}
function finishZipOverlay(title, detail){
  const sp = document.getElementById('zip-spinner'); if(sp) sp.style.display = 'none';
  const t = document.getElementById('zip-title'); if(t) t.textContent = title;
  updateZipOverlay(detail, 100);
  const c = document.getElementById('zip-close'); if(c) c.style.display = 'inline-block';
}
let zipping = false;
window.__downloadZip = async function(){
  if(zipping || !state.galleryData) return;
  const photos = state.galleryData.photos;
  if(!photos.length) return;
  const parts = Math.ceil(photos.length / ZIP_CHUNK);
  if(!confirm(`Se prepararán ${photos.length} fotografía(s) en ${parts} archivo(s) ZIP de hasta ${ZIP_CHUNK} fotos cada uno. Puede tardar varios minutos y debes mantener esta pestaña abierta. ¿Continuar?`)) return;
  zipping = true;
  showZipOverlay();
  const btn = document.getElementById('dl-zip-btn');
  const status = document.getElementById('dl-all-status');
  if(btn) btn.disabled = true;
  try{
    await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
  } catch(e){
    finishZipOverlay('No se pudo iniciar', 'No se pudo cargar el compresor ZIP. Revisa tu conexión e intenta de nuevo.');
    if(btn) btn.disabled = false; zipping = false; return;
  }
  const baseName = (state.galleryData.name || 'galeria').replace(/[^\w\-]+/g,'_');
  const failed = [];
  for(let part=0; part<parts; part++){
    const zip = new JSZip();
    const start = part*ZIP_CHUNK, end = Math.min(start+ZIP_CHUNK, photos.length);
    for(let i=start; i<end; i++){
      if(status) status.textContent = `Parte ${part+1} de ${parts}: preparando foto ${i+1} de ${photos.length}… no cierres esta pestaña.`;
      updateZipOverlay(`Parte ${part+1} de ${parts} · foto ${i+1} de ${photos.length}`, (i/photos.length)*100);
      try{
        const { bytes, ext } = await fetchPhotoBytes(photos[i]);
        zip.file(`${baseName}_${String(i+1).padStart(3,'0')}.${ext}`, bytes);
      } catch(e){
        console.error('Foto omitida', i+1, e);
        failed.push(i+1);
      }
    }
    if(!Object.keys(zip.files).length) continue;
    if(status) status.textContent = `Parte ${part+1} de ${parts}: comprimiendo…`;
    updateZipOverlay(`Parte ${part+1} de ${parts} · comprimiendo, casi listo…`, (end/photos.length)*100);
    const blob = await zip.generateAsync({ type:'blob', compression:'STORE' }); // fotos ya vienen comprimidas
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = parts > 1 ? `${baseName}_parte${part+1}de${parts}.zip` : `${baseName}.zip`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 60000);
    await new Promise(r=>setTimeout(r, 1200));
  }
  if(status) status.textContent = failed.length
    ? `Listo, pero ${failed.length} foto(s) no se pudieron incluir (n.º ${failed.slice(0,15).join(', ')}${failed.length>15?'…':''}). Usa "Descargar todas" para esas.`
    : `Listo: ${parts} archivo(s) ZIP descargados. Revisa tu carpeta de Descargas.`;
  finishZipOverlay(failed.length ? 'Descarga lista (con avisos)' : '¡Listo!',
    failed.length ? `${failed.length} foto(s) no se pudieron incluir (n.º ${failed.slice(0,15).join(', ')}${failed.length>15?'…':''}). Usa "Descargar todas" para esas.`
                  : `Se descargaron ${parts} archivo(s) ZIP. Revisa tu carpeta de Descargas.`);
  if(btn) btn.disabled = false;
  zipping = false;
};

/* ---- Navegación del lightbox: flechas del teclado, botones ‹ ›, deslizar en celular ---- */
function lightboxContext(){
  const range = n => Array.from({ length:n }, (_,i)=>i);
  if(state.view==='gallery' && state.lightbox!==null && state.galleryData) return { key:'lightbox', list: range(state.galleryData.photos.length) };
  if(state.view==='public' && state.lightbox!==null) return { key:'lightbox', list: range(state.portfolio.length) };
  if(state.view==='galeria-cat' && state.lightboxG!==null){
    const cur = state.galeria[state.lightboxG];
    if(!cur) return null;
    return { key:'lightboxG', list: state.galeria.map((p,i)=>p.category===cur.category ? i : -1).filter(i=>i>=0) };
  }
  return null;
}
window.__lbStep = function(dir){
  const c = lightboxContext();
  if(!c || c.list.length < 2) return;
  const pos = c.list.indexOf(state[c.key]);
  state[c.key] = c.list[((pos < 0 ? 0 : pos) + dir + c.list.length) % c.list.length]; // da la vuelta al llegar al final
  render();
};
document.addEventListener('keydown', (e)=>{
  const c = lightboxContext();
  if(!c) return;
  if(e.key==='ArrowRight'){ e.preventDefault(); window.__lbStep(1); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); window.__lbStep(-1); }
  else if(e.key==='Escape'){ state.lightbox = null; state.lightboxG = null; render(); }
});
let _touchX = null;
document.addEventListener('touchstart', (e)=>{ _touchX = e.touches[0].clientX; }, { passive:true });
document.addEventListener('touchend', (e)=>{
  if(_touchX === null || !lightboxContext()) { _touchX = null; return; }
  const dx = e.changedTouches[0].clientX - _touchX; _touchX = null;
  if(Math.abs(dx) > 60) window.__lbStep(dx < 0 ? 1 : -1);
}, { passive:true });

/* init */
loadInitial();
</script>
