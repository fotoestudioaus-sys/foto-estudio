<!-- Los scripts de Google (Identity Services y Picker) ya NO se cargan aquí de forma fija:
     se cargan solo cuando alguien entra al panel de administrador, para que el sitio
     público (lo que ven tus visitantes y clientes) cargue más rápido. -->
<style>
  :root{
    /* ---- Fuentes: preset por defecto "Editorial Negativo" ---- */
    --f-display: 'Newsreader', serif;
    --f-body: 'Public Sans', sans-serif;
    --f-mono: 'IBM Plex Mono', monospace;

    /* ---- Paleta base: papel / tinta ---- */
    --paper: #EDEDE6;
    --paper-2: #E3E2D9;
    --ink: #16171A;
    --ink-soft: #4A4B47;

    /* ---- Acento: preset por defecto "Ámbar de cuarto oscuro" ---- */
    --accent: #E2A233;
    --accent-ink: #16171A;
    --accent-2: #3E6E64;

    --radius: 2px;
    --maxw: 1180px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--f-body);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%; display:block;}
  a{color:inherit;}
  button{font-family:inherit;}
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 24px;}
  .mono{font-family:var(--f-mono); letter-spacing:.02em;}
  .eyebrow{
    font-family:var(--f-mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--ink-soft);
  }
  :focus-visible{outline:2px solid var(--accent); outline-offset:3px;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important;} }

  /* ---- tira de sprockets (firma visual: tira de negativo) ---- */
  .sprockets{
    height:14px;
    background-image: repeating-linear-gradient(90deg, var(--ink) 0 6px, transparent 6px 22px);
    background-position: center;
    background-repeat: repeat-x;
    background-size: 22px 6px;
    opacity:.85;
  }
  .sprockets.top{margin-bottom:0;}

  /* ---- header ---- */
  header.site{
    background:var(--paper);
    border-bottom:1px solid rgba(0,0,0,.1);
    position:sticky; top:0; z-index:40;
  }
  .nav{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 0;
  }
  .brand{
    font-family:var(--f-display); font-weight:600; font-size:22px; letter-spacing:.01em;
    text-decoration:none;
  }
  .brand .dot{color:var(--accent);}
  .navlinks{display:flex; gap:28px; align-items:center;}
  .navlinks a{
    font-family:var(--f-mono); font-size:12px; text-transform:uppercase; letter-spacing:.08em;
    text-decoration:none; color:var(--ink); border-bottom:1px solid transparent; padding-bottom:2px;
    cursor:pointer;
  }
  .navlinks a:hover{border-color:var(--accent);}
  .navlinks button.admin-link{
    background:none;border:none;cursor:pointer;color:var(--ink-soft);font-family:var(--f-mono);
    font-size:11px; text-transform:uppercase; letter-spacing:.08em;
  }

  /* ---- hero ---- */
  .hero{
    position:relative;
    display:grid; grid-template-columns: 1.1fr .9fr; gap:0;
    min-height:560px;
    background:var(--ink);
    color:var(--paper);
    overflow:hidden;
  }
  .hero-copy{
    padding:80px 56px; display:flex; flex-direction:column; justify-content:center; gap:22px; z-index:2;
  }
  .hero-copy .eyebrow{color:var(--accent);}
  .hero-title{
    font-family:var(--f-display); font-style:italic; font-weight:500;
    font-size:clamp(38px, 5vw, 64px); line-height:1.04; margin:0; max-width:12ch;
  }
  .hero-sub{
    font-size:16px; color:#D9D8CE; max-width:42ch; margin:0;
  }
  .hero-cta{display:flex; gap:14px; margin-top:6px; flex-wrap:wrap;}
  .btn{
    font-family:var(--f-mono); font-size:12px; text-transform:uppercase; letter-spacing:.08em;
    padding:13px 22px; border:1px solid var(--paper); background:transparent; color:var(--paper);
    cursor:pointer; text-decoration:none; display:inline-block; border-radius:var(--radius);
    transition:background .15s, color .15s;
  }
  .btn:hover{background:var(--paper); color:var(--ink);}
  .btn.solid{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .btn.solid:hover{filter:brightness(1.08); background:var(--accent); color:var(--accent-ink);}
  .hero-img{position:relative; overflow:hidden;}
  .hero-img img{width:100%; height:100%; object-fit:cover; min-height:400px; opacity:.92;}
  .hero-frame{
    position:absolute; top:20px; right:20px; font-family:var(--f-mono); font-size:11px;
    color:var(--paper); background:rgba(0,0,0,.45); padding:4px 8px; border:1px solid rgba(255,255,255,.4);
  }

  /* ---- secciones ---- */
  section{padding:88px 0;}
  .section-head{
    display:flex; align-items:baseline; justify-content:space-between; gap:24px; margin-bottom:40px;
    flex-wrap:wrap;
  }
  .section-title{
    font-family:var(--f-display); font-size:34px; font-weight:600; margin:6px 0 0;
  }

  /* ---- filtros de categoría ---- */
  .filters{display:flex; gap:10px; flex-wrap:wrap;}
  .filter-btn{
    font-family:var(--f-mono); font-size:11px; text-transform:uppercase; letter-spacing:.06em;
    padding:8px 14px; border:1px solid var(--ink); background:transparent; cursor:pointer;
    border-radius:20px;
  }
  .filter-btn.active{background:var(--ink); color:var(--paper);}

  /* ---- hoja de contactos (grid de portafolio) ---- */
  .contact-sheet{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:2px;
    background:var(--ink);
    border:2px solid var(--ink);
  }
  .frame{
    position:relative; background:var(--ink); aspect-ratio:4/5; overflow:hidden; cursor:pointer;
  }
  .frame img{width:100%; height:100%; object-fit:cover; transition:transform .5s ease, opacity .3s;}
  .frame:hover img{transform:scale(1.045);}
  .frame-num{
    position:absolute; top:8px; left:8px; font-family:var(--f-mono); font-size:10px; color:#fff;
    background:rgba(0,0,0,.5); padding:2px 6px; letter-spacing:.05em;
  }
  .frame-cap{
    position:absolute; left:0; right:0; bottom:0; padding:8px 10px; font-family:var(--f-mono); font-size:10.5px;
    color:#fff; background:linear-gradient(0deg, rgba(0,0,0,.75), transparent); opacity:0; transition:opacity .2s;
  }
  .frame:hover .frame-cap{opacity:1;}
  .empty-state{
    grid-column:1/-1; padding:60px 20px; text-align:center; color:var(--ink-soft); font-family:var(--f-mono); font-size:13px;
  }
  @media (max-width:820px){ .contact-sheet{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:480px){ .contact-sheet{grid-template-columns:repeat(1,1fr);} }

  /* ---- lightbox ---- */
  .lightbox{
    position:fixed; inset:0; background:rgba(10,10,10,.94); z-index:100;
    display:flex; align-items:center; justify-content:center; padding:40px;
  }
  .lightbox img{max-height:88vh; max-width:88vw; object-fit:contain;}
  .lightbox-close{
    position:absolute; top:24px; right:32px; background:none; border:none; color:#fff; font-size:28px; cursor:pointer;
    font-family:var(--f-mono);
  }
  .zip-overlay{position:fixed; inset:0; z-index:300; background:rgba(8,9,10,.88); display:flex; align-items:center; justify-content:center; padding:20px;}
  .zip-box{background:#16181B; border:1px solid var(--accent); border-radius:10px; max-width:440px; width:100%; padding:30px 26px; text-align:center; color:#F2F0E8;}
  .zip-box h3{font-family:var(--f-display); font-size:24px; margin:14px 0 8px;}
  .zip-box p{font-size:14px; color:#B9B8AC; margin:6px 0;}
  .zip-spinner{width:44px; height:44px; margin:0 auto; border:4px solid rgba(255,255,255,.15); border-top-color:var(--accent); border-radius:50%; animation:zipspin 1s linear infinite;}
  @keyframes zipspin{to{transform:rotate(360deg)}}
  .zip-bar{height:8px; background:rgba(255,255,255,.12); border-radius:4px; overflow:hidden; margin:18px 0 8px;}
  .zip-bar > div{height:100%; width:0; background:var(--accent); transition:width .3s;}
  .lightbox-nav{
    position:absolute; top:50%; transform:translateY(-50%); background:rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.25);
    color:#fff; width:48px; height:48px; border-radius:50%; font-size:22px; cursor:pointer; font-family:var(--f-mono);
  }
  .lightbox-nav:hover{background:rgba(0,0,0,.7);}
  .lightbox-nav.prev{left:20px;} .lightbox-nav.next{right:20px;}
  .lightbox-count{position:absolute; top:30px; left:0; right:0; text-align:center; color:#bbb; font-family:var(--f-mono); font-size:12px; pointer-events:none;}
  .lightbox-cap{position:absolute; bottom:26px; left:0; right:0; text-align:center; color:#ddd; font-family:var(--f-mono); font-size:12px;}

  /* ---- about ---- */
  .about{
    display:grid; grid-template-columns:.85fr 1.15fr; gap:64px; align-items:center;
  }
  .about img{aspect-ratio:4/5; object-fit:cover; width:100%;}
  .about-text p{font-size:16.5px; color:var(--ink-soft); max-width:56ch;}
  @media (max-width:760px){ .about{grid-template-columns:1fr;} }

  /* ---- contacto ---- */
  .contact-band{background:var(--ink); color:var(--paper);}
  .contact-band .section-title{color:var(--paper);}
  .contact-grid{display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:30px;}
  .contact-info p{color:#D9D8CE; max-width:50ch;}
  .contact-links{display:flex; gap:18px; flex-wrap:wrap;}

  footer.site{padding:26px 0; font-family:var(--f-mono); font-size:11px; color:var(--ink-soft); display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;}

  /* =====================================================
     ADMIN — panel "cuarto oscuro": tema oscuro, utilitario
     ===================================================== */
  .admin-shell{
    min-height:100vh; background:#0F1113; color:#E7E6DF; font-family:var(--f-body);
  }
  .admin-top{
    display:flex; align-items:center; justify-content:space-between; padding:16px 28px;
    border-bottom:1px solid #23262A; background:#0B0D0E; position:sticky; top:0; z-index:10;
  }
  .admin-top .brand{color:#E7E6DF; font-size:17px;}
  .admin-top .brand .dot{color:var(--accent);}
  .admin-actions{display:flex; gap:12px; align-items:center;}
  .admin-actions .btn{border-color:#3A3D41; color:#E7E6DF;}
  .admin-actions .btn:hover{background:#E7E6DF; color:#0F1113;}
  .admin-body{display:grid; grid-template-columns:220px 1fr; min-height:calc(100vh - 60px);}
  .admin-nav{border-right:1px solid #23262A; padding:24px 0;}
  .admin-nav button{
    display:block; width:100%; text-align:left; padding:12px 26px; background:none; border:none; color:#9C9C93;
    font-family:var(--f-mono); font-size:12px; text-transform:uppercase; letter-spacing:.06em; cursor:pointer;
    border-left:2px solid transparent;
  }
  .admin-nav button.active{color:#fff; border-left-color:var(--accent); background:#16181B;}
  .admin-main{padding:36px 40px; max-width:920px;}
  .admin-h{font-family:var(--f-mono); font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:#9C9C93; margin-bottom:6px;}
  .admin-title{font-family:var(--f-display); font-size:26px; margin:0 0 28px; color:#fff;}
  .field{margin-bottom:20px;}
  .field label{display:block; font-family:var(--f-mono); font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:#9C9C93; margin-bottom:7px;}
  .field input[type=text], .field input[type=email], .field input[type=tel], .field input[type=url], .field input[type=password], .field textarea, .field select{
    width:100%; background:#16181B; border:1px solid #2B2E32; color:#E7E6DF; padding:11px 13px; border-radius:3px;
    font-family:var(--f-body); font-size:14px;
  }
  .field textarea{min-height:90px; resize:vertical;}
  .field input:focus, .field textarea:focus, .field select:focus{outline:2px solid var(--accent); border-color:var(--accent);}
  .row{display:grid; gap:16px;}
  .row.cols-2{grid-template-columns:1fr 1fr;}
  .row.cols-3{grid-template-columns:1fr 1fr 1fr;}
  @media (max-width:700px){ .row.cols-2, .row.cols-3{grid-template-columns:1fr;} }
  .card{background:#16181B; border:1px solid #23262A; padding:20px; border-radius:4px; margin-bottom:16px;}
  .btn-dark{
    font-family:var(--f-mono); font-size:12px; text-transform:uppercase; letter-spacing:.06em;
    padding:11px 18px; background:var(--accent); color:#16171A; border:none; cursor:pointer; border-radius:3px;
  }
  .btn-dark:hover{filter:brightness(1.08);}
  .btn-ghost{
    font-family:var(--f-mono); font-size:12px; text-transform:uppercase; letter-spacing:.06em;
    padding:10px 16px; background:transparent; color:#E7E6DF; border:1px solid #3A3D41; cursor:pointer; border-radius:3px;
  }
  .btn-ghost:hover{border-color:#E7E6DF;}
  .btn-danger{color:#E06B5A; border-color:#4a2c26;}
  .btn-danger:hover{background:#2a1512; border-color:#E06B5A;}
  .save-msg{font-family:var(--f-mono); font-size:12px; color:#7FBF8A; margin-left:14px;}
  .thumb-row{display:flex; gap:14px; align-items:center; padding:12px; border:1px solid #23262A; border-radius:4px; margin-bottom:10px; background:#121415;}
  .thumb-row img{width:64px; height:64px; object-fit:cover; border-radius:3px; flex-shrink:0;}
  .thumb-meta{flex:1; min-width:0;}
  .thumb-meta .cap{font-size:13px;}
  .thumb-meta .cat{font-family:var(--f-mono); font-size:10.5px; color:#9C9C93; text-transform:uppercase;}
  .thumb-actions{display:flex; gap:8px; flex-shrink:0;}
  .icon-btn{background:none; border:1px solid #3A3D41; color:#E7E6DF; width:30px; height:30px; border-radius:3px; cursor:pointer; font-size:13px;}
  .icon-btn:hover{border-color:#E7E6DF;}
  .icon-btn.danger{border-color:#4a2c26; color:#E06B5A;}
  .icon-btn.danger:hover{background:#2a1512;}
  .swatch-row{display:flex; gap:12px; flex-wrap:wrap;}
  .swatch{
    border:1px solid #2B2E32; border-radius:5px; padding:12px 14px; cursor:pointer; background:#16181B; min-width:150px;
  }
  .swatch.active{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent);}
  .swatch .dots{display:flex; gap:6px; margin-bottom:8px;}
  .swatch .dots span{width:16px; height:16px; border-radius:50%; display:inline-block;}
  .swatch .name{font-family:var(--f-mono); font-size:11px; color:#E7E6DF;}
  .hint{font-family:var(--f-mono); font-size:11px; color:#7C7C74; line-height:1.6; margin-top:6px;}
  .gallery-link-box{
    display:flex; gap:8px; align-items:center; background:#0B0D0E; border:1px solid #2B2E32; padding:10px 12px; border-radius:3px;
  }
  .gallery-link-box input{background:none; border:none; color:#E7E6DF; font-family:var(--f-mono); font-size:12.5px; flex:1;}
  .status-pill{font-family:var(--f-mono); font-size:10px; text-transform:uppercase; padding:3px 8px; border-radius:10px; letter-spacing:.05em;}
  .status-pill.ok{background:#173323; color:#7FBF8A;}
  .status-pill.warn{background:#3a2f14; color:#E2A233;}
  .status-pill.expired{background:#3a1414; color:#E06B5A;}

  /* login */
  .login-shell{min-height:100vh; background:#0F1113; color:#E7E6DF; display:flex; align-items:center; justify-content:center; padding:20px;}
  .login-card{width:100%; max-width:380px; background:#16181B; border:1px solid #23262A; padding:36px 32px; border-radius:6px;}
  .login-card h1{font-family:var(--f-display); font-size:24px; margin:0 0 6px;}
  .login-card p.eyebrow{margin-bottom:20px;}
  .error-msg{color:#E06B5A; font-family:var(--f-mono); font-size:12px; margin-top:10px;}

  /* ---- página de galería de cliente ---- */
  .gallery-hero{
    background:var(--ink); color:var(--paper); padding:70px 0 46px; text-align:center;
  }
  .gallery-hero .eyebrow{color:var(--accent); justify-content:center; display:flex;}
  .gallery-hero h1{font-family:var(--f-display); font-style:italic; font-size:clamp(30px,4.5vw,46px); margin:10px 0;}
  .gallery-meta{font-family:var(--f-mono); font-size:12px; color:#B9B8AC;}
  .gallery-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; padding:50px 0;}
  @media (max-width:820px){ .gallery-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:480px){ .gallery-grid{grid-template-columns:1fr;} }
  .gallery-grid .frame{aspect-ratio:3/2; border-radius:3px;}
  .expired-box{
    max-width:520px; margin:100px auto; text-align:center; padding:0 20px;
  }
  .expired-box .eyebrow{justify-content:center; display:flex; color:#E06B5A;}
  .expired-box h1{font-family:var(--f-display); font-size:28px;}
  .loading-box{min-height:60vh; display:flex; align-items:center; justify-content:center; font-family:var(--f-mono); color:var(--ink-soft);}

  /* ---- editor de fotos / retoque (modal, estilo "cuarto oscuro") ---- */
  .editor-overlay{
    position:fixed; inset:0; background:rgba(6,7,8,.86); z-index:200;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }

<script>
/* =====================================================================
   ESTUDIO — prototipo de sitio fotográfico con panel admin y galerías
   temporales para clientes. Todo el contenido vive en una hoja de Google

   -----------------------------------------------------------------

   Mientras no la pegues, el sitio funciona en modo de solo lectura

const API_URL = 'https://script.google.com/macros/s/AKfycbxUeXjG654dqeqpmjJU_NlwbU98D1BaqPxOhxi34YlfighKLSjVxAwelRlqTGinawDO/exec';

const STORAGE_AVAILABLE = !!API_URL && !API_URL.includes('PEGA_AQUI');

/* =====================================================================
   LLAVE SECRETA DEL BACKEND (seguridad adicional)
   -----------------------------------------------------------------
   Ya te generé una llave aleatoria segura abajo. Copia esa MISMA
   cadena exacta en tu backend de Apps Script (busca APP_SECRET en
   ese archivo) — deben coincidir carácter por carácter.
   Sin esto, cualquiera que descubra tu URL de Apps Script podría leer
   o escribir tu hoja directamente. Con esto, el backend rechaza toda
   solicitud que no incluya esta llave.
   Si algún día sospechas que esta llave se filtró, genera otra nueva
   y actualízala en ambos lugares (sitio y Apps Script).
   ===================================================================== */
const APP_SECRET = 'drm9O2aAA2MHVaPHRLUhty7UEufRaFXBwpvXGtQPMs0';

const DRIVE_CLIENT_ID = '338085803736-0m2d8bttsosr638ca6fktlcqg327535d.apps.googleusercontent.com';
const DRIVE_ENABLED = !!DRIVE_CLIENT_ID && !DRIVE_CLIENT_ID.includes('PEGA_AQUI');
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file'; // solo archivos que este sitio crea, no todo tu Drive

/* =====================================================================
   SELECTOR VISUAL DE GOOGLE DRIVE (Picker)
   -----------------------------------------------------------------
   Pega aquí tu "Clave de API" (API key) de Google Cloud Console,
   restringida a la Picker API y a tu dominio. Con esto puedes abrir

const PICKER_API_KEY = 'AIzaSyBd1LkxVXFcpkEkORY3ekpa9WXqMzEHnGE';
const PICKER_ENABLED = !!PICKER_API_KEY && !PICKER_API_KEY.includes('PEGA_AQUI');

let _lastSaveAlert = 0;
function notifySaveError(e){
  if(Date.now() - _lastSaveAlert < 8000) return; // no repetir el aviso varias veces seguidas
  _lastSaveAlert = Date.now();
  alert('No se pudo guardar el último cambio en tu hoja de Google Sheets (' + (e && e.message ? e.message : 'error desconocido') + '). Se ve en pantalla, pero NO quedó guardado. Si el problema continúa, avísame con este mensaje.');
}

/* ---- Ventana de progreso (subidas y guardados largos) ---- */
function progressStart(title){
  const old = document.getElementById('prog-overlay'); if(old) old.remove();
  const el = document.createElement('div');
  el.id = 'prog-overlay'; el.className = 'zip-overlay';
  el.innerHTML = `<div class="zip-box">
    <div class="zip-spinner" id="prog-spinner"></div>
    <h3 id="prog-title">${title}</h3>
    <div id="prog-pct" style="font-family:var(--f-mono); font-size:34px; color:var(--accent); margin:6px 0;">0%</div>
    <div class="zip-bar"><div id="prog-bar"></div></div>
    <p id="prog-detail" style="font-family:var(--f-mono); font-size:12px; white-space:pre-line;"></p>
    <p id="prog-warn"><strong>No cierres ni recargues esta pestaña hasta que termine.</strong></p>
    <button class="btn" id="prog-close" style="display:none; margin-top:14px;" onclick="document.getElementById('prog-overlay').remove()">Cerrar</button>
  </div>`;
  document.body.appendChild(el);
}
function progressUpdate(done, total, detail, title){
  const pct = total ? Math.min(100, (done/total)*100) : 0;
  const a = document.getElementById('prog-pct'); if(a) a.textContent = Math.round(pct) + '%';
  const b = document.getElementById('prog-bar'); if(b) b.style.width = pct + '%';
  const d = document.getElementById('prog-detail'); if(d) d.textContent = detail !== undefined ? detail : `${done} de ${total}`;
  if(title){ const t = document.getElementById('prog-title'); if(t) t.textContent = title; }
}
function progressFinish(title, detail){
  const sp = document.getElementById('prog-spinner'); if(sp) sp.style.display = 'none';
  const w = document.getElementById('prog-warn'); if(w) w.style.display = 'none';
  const t = document.getElementById('prog-title'); if(t) t.textContent = title;
  const d = document.getElementById('prog-detail'); if(d) d.textContent = detail || '';
  const c = document.getElementById('prog-close'); if(c) c.style.display = 'inline-block';
}
/* Ejecuta tareas con varias a la vez (concurrency), conservando el orden de resultados. */
async function runPool(items, worker, concurrency, onProgress){
  const results = new Array(items.length);
  let next = 0, done = 0;
  async function lane(){
    while(true){
      const i = next++;
      if(i >= items.length) return;
      try{ results[i] = { ok:true, value: await worker(items[i], i) }; }
      catch(e){ results[i] = { ok:false, error:e }; }
      done++;
      if(onProgress) onProgress(done, items.length);
    }
  }
  await Promise.all(Array.from({ length: Math.min(concurrency, items.length) }, lane));
  return results;
}
function failedSummary(names, expired){
  if(!names.length) return '';
  return `\n\n⚠ ${names.length} no se pudieron subir:\n${names.slice(0,8).join('\n')}${names.length>8?`\n… y ${names.length-8} más`:''}` +
    (expired ? '\n\nTu conexión con Google Drive expiró (dura ~1 hora). Vuelve a pulsar "Conectar Google Drive" y sube solo esas fotos.' : '');
}
/* Sube archivos con porcentaje. Devuelve { items:[{name,url}], failed:[nombres], expired } o null si se bloqueó. */
async function uploadFilesWithProgress(files, folderPathNames){
  if(!files.length) return { items:[], failed:[], expired:false };
  if(!driveConnected() && files.length > 15){
    alert('Sin Google Drive conectado las fotos se guardan comprimidas dentro del sitio, y no es viable para más de 15 a la vez. Conecta Google Drive (botón arriba en el panel) para subir muchas fotos.');
    return null;
  }
  progressStart(`Subiendo ${files.length} foto(s)…`);
  progressUpdate(0, files.length);
  const results = await runPool(files, f=>smartUploadFile(f, folderPathNames), driveConnected() ? 3 : 2,
    (d,t)=>progressUpdate(d, t, `Subidas ${d} de ${t}`));
  const items = [], failed = []; let expired = false;
  results.forEach((r,i)=>{
    if(r.ok) items.push({ name: files[i].name, url: r.value });
    else { failed.push(files[i].name); if(r.error && r.error.message === 'SESION_DRIVE_EXPIRADA') expired = true; }
  });
  return { items, failed, expired };
}
/* Guarda y cierra la ventana de progreso con un resumen. */
async function saveAndFinish(saveFn, addedCount, failed, expired, extraNote){
  progressUpdate(100, 100, 'Guardando en tu hoja de Google Sheets…', 'Guardando…');
  const ok = await saveFn();
  if(ok === false){
    progressFinish('No se pudo guardar', 'Las fotos se ven en pantalla pero NO quedaron guardadas en tu hoja. Intenta de nuevo en un momento.' + failedSummary(failed, expired));
  } else {
    progressFinish(failed.length ? 'Listo, con avisos' : '¡Listo!', `Se agregaron ${addedCount} foto(s) y quedaron guardadas ✓` + (extraNote||'') + failedSummary(failed, expired));
  }
}

const STORAGE = {
  async get(key, shared=true){
    if(!STORAGE_AVAILABLE) return null;
    try{
      const res = await fetch(`${API_URL}?action=get&key=${encodeURIComponent(key)}&secret=${encodeURIComponent(APP_SECRET)}`);
      const data = await res.json();
      return (data && data.value !== null && data.value !== undefined && data.value !== '') ? JSON.parse(data.value) : null;
    } catch(e){ console.error('Error leyendo', key, e); return null; }
  },
  async set(key, value, shared=true, quiet=false){
    if(!STORAGE_AVAILABLE) return null;
    try{
      const res = await fetch(API_URL, {
        method:'POST',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({ action:'set', key, value: JSON.stringify(value), secret: APP_SECRET })
      });
      const data = await res.json();
      if(!data || !data.ok) throw new Error((data && data.error) || 'respuesta inesperada del backend');
      return true;
    } catch(e){
      console.error('Error guardando', key, e);
      if(!quiet) notifySaveError(e);
      return false;
    }
  },
  async delete(key, shared=true){
    if(!STORAGE_AVAILABLE) return null;
    try{
      await fetch(API_URL, {
        method:'POST',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({ action:'delete', key, secret: APP_SECRET })
      });
      return true;
    } catch(e){ return null; }
  },
  /* Agrega "id" a la lista guardada en "key" de forma ATÓMICA en el servidor
     (lee + agrega + guarda en un solo paso allá, con bloqueo) — evita que dos
     creaciones casi simultáneas se pisen entre sí, cosa que sí podía pasar
     haciendo esto en dos pasos separados desde el navegador. */
  async appendToIndex(key, id){
    if(!STORAGE_AVAILABLE) return null;
    try{
      await fetch(API_URL, {
        method:'POST',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({ action:'appendToIndex', key, value: id, secret: APP_SECRET })
      });
      return true;
    } catch(e){ console.error('Error agregando al índice', key, e); return null; }
  }
};

const LEGACY_CAT_MAP = { 'Fotografía urbana':'Urbano', 'Fotografía paisajes':'Paisajismo', 'Etnofotografía':'Etnografía' };
function slugify(str){
  return String(str||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'rotafolio';
}
function galeriaCatNames(){ return (state.galeriaCats||[]).map(c=>c.name); }
function rotafolioPhotos(name){ return (state.galeria||[]).filter(p=>p.category===name); }
function rotafolioCover(cat){ const ps = rotafolioPhotos(cat.name); return ps.find(p=>p.id===cat.cover) || ps[0] || null; }
/* Asegura que toda foto tenga un rotafolio y que existan los rotafolios por defecto */
function normalizeGaleria(galeria, cats){
  let changed = false;
  galeria.forEach(p=>{ const m = LEGACY_CAT_MAP[p.category]; if(m){ p.category = m; changed = true; } });
  if(!Array.isArray(cats) || !cats.length){ cats = DEFAULT_GALERIA_CATS.map(c=>({...c})); changed = true; }
  const names = new Set(cats.map(c=>c.name));
  galeria.forEach(p=>{ if(p.category && !names.has(p.category)){ cats.push({ name:p.category, desc:'', cover:'' }); names.add(p.category); changed = true; } });
  return { galeria, cats, changed };
}

/* Convierte una contraseña en un código irreversible (SHA-256), para nunca
   guardar ni transmitir la contraseña real en texto plano. */
async function sha256(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

/* ---------------------------- SESIÓN DE ADMIN (persistente) ---------------------------- */
const SESSION_KEY = 'estudiofoto_admin_session';
const SESSION_DAYS = 7;
function saveAdminSession(){
  try{ localStorage.setItem(SESSION_KEY, JSON.stringify({ ok:true, expires: Date.now() + SESSION_DAYS*24*60*60*1000 })); }
  catch(e){ /* si el navegador bloquea localStorage, simplemente no persiste entre recargas */ }
}
function hasValidAdminSession(){
  try{
    const raw = localStorage.getItem(SESSION_KEY);
    if(!raw) return false;
    const s = JSON.parse(raw);
    return !!s.ok && s.expires > Date.now();
  } catch(e){ return false; }
}
function clearAdminSession(){
  try{ localStorage.removeItem(SESSION_KEY); } catch(e){}
}

function applyDesign(design){
  const f = FONT_PRESETS[design.font] || FONT_PRESETS.editorial;
  const c = COLOR_PRESETS[design.color] || COLOR_PRESETS.aus;
  const root = document.documentElement.style;
  root.setProperty('--f-display', f.display);
  root.setProperty('--f-body', f.body);
  root.setProperty('--f-mono', f.mono);
  root.setProperty('--accent', c.accent);
  root.setProperty('--accent-2', c.accent2);
  root.setProperty('--b-blue', c.blue); root.setProperty('--b-cyan', c.cyan); root.setProperty('--b-mag', c.mag);
  root.setProperty('--b-ink', c.ink); root.setProperty('--b-soft', c.soft); root.setProperty('--b-wash', c.wash);
}

function fileIdFromDriveUrl(url){
  const m1 = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
  if(m1) return m1[1];
  const m2 = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if(m2) return m2[1];
  return null;
}
function normalizeImageUrl(url){
  if(!url) return url;
  if(url.includes('drive.google.com')){
    const id = fileIdFromDriveUrl(url);
    // Google desactivó el formato antiguo "uc?export=view" (ahora da error 403).
    // El formato "thumbnail" con tamaño grande es el que sigue funcionando en 2026,
    // aunque Google puede limitar la velocidad si hay muchas fotos en la misma página.
    if(id) return `https://drive.google.com/thumbnail?id=${id}&sz=w2000`;
  }
  return url;
}

function addMonths(date, months){
  const d = new Date(date);
  d.setMonth(d.getMonth() + months);
  return d;
}
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('es-MX', { year:'numeric', month:'short', day:'numeric' });
}

/* Carga un <script> externo una sola vez y avisa cuando está listo. Se usa para
   traer los scripts de Google Identity Services / Picker SOLO cuando alguien
   entra al panel de administrador, no para cada visitante público. */
const _loadedScripts = {};
function loadScriptOnce(src){
  if(_loadedScripts[src]) return _loadedScripts[src];
  _loadedScripts[src] = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = src; s.async = true;
    s.onload = ()=> resolve();
    s.onerror = ()=> reject(new Error('No se pudo cargar ' + src));
    document.head.appendChild(s);
  });
  return _loadedScripts[src];
}
function ensureGoogleAdminScriptsLoading(){
  loadScriptOnce('https://accounts.google.com/gsi/client');
  loadScriptOnce('https://apis.google.com/js/api.js');
}

/* Vista previa en vivo: detecta si una URL de foto realmente carga antes de guardarla.
   Se usa en los formularios de "agregar foto" (portafolio y galerías). */
window.__previewUrl = function(inputId, previewId){
  const input = document.getElementById(inputId);
  const preview = document.getElementById(previewId);
  if(!input || !preview) return;
  const raw = input.value.trim();
  if(!raw){ preview.innerHTML = ''; return; }
  const url = normalizeImageUrl(raw);
  preview.innerHTML = `<p class="hint">Verificando…</p>`;
  const testImg = new Image();
  testImg.onload = function(){
    preview.innerHTML = `<img src="${url}" style="max-width:160px; max-height:160px; border-radius:4px; display:block;"><p class="hint" style="color:#7FBF8A;">Se ve bien ✓</p>`;
  };
  testImg.onerror = function(){
    const isDrive = raw.includes('drive.google.com');
    preview.innerHTML = `<p class="hint" style="color:#E06B5A;">Esta liga no cargó. ${isDrive ? 'Revisa que el archivo esté compartido como "Cualquier persona con el enlace" y que sea una foto individual, no una carpeta. Google a veces bloquea estas ligas de forma intermitente — si insiste, usa Cloudinary (ver guía de producción, Camino 2).' : 'Revisa que la URL apunte directo a una imagen.'}</p>`;
  };
  testImg.src = url;
};

/* Igual que __previewUrl pero para varias ligas a la vez (una por línea), para subida masiva. */
window.__previewMultiUrl = function(textareaId, previewId){
  const textarea = document.getElementById(textareaId);
  const preview = document.getElementById(previewId);
  if(!textarea || !preview) return;
  const lines = textarea.value.split('\n').map(l=>l.trim()).filter(Boolean);
  if(!lines.length){ preview.innerHTML = ''; return; }
  preview.innerHTML = lines.map((raw,i)=>`<div id="mp-slot-${i}" style="width:90px;"><div style="width:90px; height:90px; background:#16181B; border-radius:4px; display:flex; align-items:center; justify-content:center; font-family:var(--f-mono); font-size:10px; color:#9C9C93;">…</div></div>`).join('');
  lines.forEach((raw,i)=>{
    const url = normalizeImageUrl(raw);
    const testImg = new Image();
    const slot = document.getElementById('mp-slot-'+i);
    testImg.onload = function(){
      if(slot) slot.innerHTML = `<img src="${url}" style="width:90px; height:90px; object-fit:cover; border-radius:4px; display:block;"><div class="hint" style="color:#7FBF8A; text-align:center;">✓</div>`;
    };
    testImg.onerror = function(){
      if(slot) slot.innerHTML = `<div style="width:90px; height:90px; background:#2a1512; border-radius:4px; display:flex; align-items:center; justify-content:center; color:#E06B5A; font-size:20px;">✕</div><div class="hint" style="color:#E06B5A; text-align:center;">Liga ${i+1} falló</div>`;
    };
    testImg.src = url;
  });
};

async function loadInitial(){
  const params = new URLSearchParams(window.location.search);
  const g = params.get('g');
  const adminParam = params.has('admin');

  let [content, design, portfolio, galeria, galeriaCats] = await Promise.all([
    STORAGE.get('site:content'), STORAGE.get('site:design'), STORAGE.get('site:portfolio'), STORAGE.get('site:galeria'), STORAGE.get('site:galeria-cats')
  ]);
  if(!content){ content = DEFAULT_CONTENT; await STORAGE.set('site:content', content); }
  else if(!content.calendlyLink){ content = {...DEFAULT_CONTENT, ...content, calendlyLink: DEFAULT_CONTENT.calendlyLink}; await STORAGE.set('site:content', content); }
  if(!design){ design = DEFAULT_DESIGN; await STORAGE.set('site:design', design); }
  else if(design.font === 'editorial' && design.color === 'ambar'){
    // Tenía el diseño original por defecto: pasa al diseño de marca Fotoaus (se puede cambiar en la pestaña Diseño)
    design = DEFAULT_DESIGN; STORAGE.set('site:design', design);
  }
  if(!portfolio){ portfolio = DEFAULT_PORTFOLIO; await STORAGE.set('site:portfolio', portfolio); }
  if(!galeria){ galeria = DEFAULT_GALERIA; await STORAGE.set('site:galeria', galeria); }

  const norm = normalizeGaleria(galeria, galeriaCats);
  state.galeria = norm.galeria; state.galeriaCats = norm.cats;
  if(norm.changed && hasValidAdminSession()){
    STORAGE.set('site:galeria', state.galeria); STORAGE.set('site:galeria-cats', state.galeriaCats);
  }
  state.content = content; state.design = design; state.portfolio = portfolio;
  applyDesign(design);

  if(g){
    state.view = 'gallery'; state.galleryId = g;
    state.galleryData = await STORAGE.get('gallery:' + g);
    render();
  } else if(adminParam){
    if(hasValidAdminSession()){
      state.isAdmin = true; state.view = 'admin';
      render();
    } else {
      // La contraseña solo se consulta cuando alguien realmente va a iniciar sesión,
      // no en cada carga pública del sitio — así los visitantes normales no pagan ese costo.
      await ensureAdminPasswordReady();
      state.view = 'admin-login';
      render();
    }
  } else {
    const r = parseRoute();
    if(r){ state.view = r.view; state.rotafolio = r.slug || null; }
    else state.view = 'public';
    render();
  }
}

/* ---- Rutas del sitio público: ?galeria (todos los rotafolios) y ?galeria=<rotafolio> ---- */
function parseRoute(){
  const params = new URLSearchParams(location.search);
  if(params.has('galeria')){
    const slug = params.get('galeria');
    return slug ? { view:'galeria-cat', slug } : { view:'galeria-hub' };
  }
  return null;
}
function navigate(view, slug){
  state.lightbox = null; state.lightboxG = null;
  state.view = view; state.rotafolio = slug || null;
  const url = view === 'galeria-hub' ? '?galeria' : view === 'galeria-cat' ? '?galeria=' + encodeURIComponent(slug) : location.pathname;
  history.pushState({}, '', url);
  render();
  window.scrollTo(0, 0);
}
window.addEventListener('popstate', ()=>{
  if(!state.content) return;
  const p = new URLSearchParams(location.search);
  if(p.has('g') || p.has('admin')){ location.reload(); return; }
  const r = parseRoute();
  state.lightbox = null; state.lightboxG = null;
  if(r){ state.view = r.view; state.rotafolio = r.slug || null; } else { state.view = 'public'; state.rotafolio = null; }
  render();
  window.scrollTo(0, 0);
});

async function ensureAdminPasswordReady(){
  let pass = await STORAGE.get('site:admin-pass');
  if(!pass){
    pass = { hash: DEFAULT_PASSWORD_HASH };
    await STORAGE.set('site:admin-pass', pass);
  } else if(pass.value && !pass.hash){
    // Migración: contraseñas guardadas antes de este cambio estaban en texto plano.
    pass = { hash: await sha256(pass.value) };
    await STORAGE.set('site:admin-pass', pass);
  }
  return pass;
}

/* ---------------------------- RENDER ROOT ---------------------------- */
function render(){
  const app = document.getElementById('app');
  app.className = (state.view === 'admin' || state.view === 'admin-login') ? '' : 'pub';
  if(state.view === 'public') app.innerHTML = renderPublic();
  else if(state.view === 'galeria-hub') app.innerHTML = renderGaleriaHub();
  else if(state.view === 'galeria-cat') app.innerHTML = renderRotafolio(state.rotafolio);
  else if(state.view === 'gallery') app.innerHTML = renderGallery();
  else if(state.view === 'admin-login') app.innerHTML = renderLogin();
  else if(state.view === 'admin') app.innerHTML = renderAdmin();
  bindEvents();
}

const ROTAFOLIO_PAGE_SIZE = 60;

  const cats = state.galeriaCats;
  const cat = cats.find(c => slugify(c.name) === slug);
  if(!cat){
    return `${renderHeader('galeria')}
    <div class="expired-box">

      <h1>Este rotafolio no existe.</h1>
      <p><a class="btn solid" href="?galeria" data-action="go-galeria">Ver todos los rotafolios</a></p>

  }
  const ps = rotafolioPhotos(cat.name);
  const visible = state.rotafolioVisible[slug] || ROTAFOLIO_PAGE_SIZE;
  const shown = ps.slice(0, visible);
  const remaining = ps.length - shown.length;
  const next = cats[(cats.indexOf(cat) + 1) % cats.length];

  return `
  ${renderHeader('galeria')}
  <section class="page-hero">
    <div class="wrap">

            <img src="${normalizeImageUrl(p.url) || p.url}" alt="${escapeHtml(p.caption||'')}" loading="lazy" style="filter:${cssFilterFor(p)}">

window.__galeriaMore = function(ci){
  const c = state.galeriaCats[ci]; if(!c) return;
  state.galeriaAdminVisible[c.name] = (state.galeriaAdminVisible[c.name] || 30) + 30;
  render();
};
window.__catSave = function(i){
  const cats = state.galeriaCats, c = cats[i]; if(!c) return;
  const newName = document.getElementById('cat-name-'+i).value.trim();
  const desc = document.getElementById('cat-desc-'+i).value.trim();
  if(!newName){ alert('El rotafolio necesita un nombre.'); return; }
  const old = c.name;
  const renamed = newName !== old;
  if(renamed){
    if(cats.some((x,j)=> j!==i && slugify(x.name) === slugify(newName))){ alert('Ya existe un rotafolio con ese nombre (o uno casi igual).'); return; }
    state.galeria.forEach(p=>{ if(p.category === old) p.category = newName; });
    c.name = newName;
  }
  c.desc = desc;
  flashSave();
  STORAGE.set('site:galeria-cats', cats);
  if(renamed) STORAGE.set('site:galeria', state.galeria);
};
window.__catAdd = function(){
  const name = document.getElementById('cat-new-name').value.trim();
  const desc = document.getElementById('cat-new-desc').value.trim();
  if(!name){ alert('Escribe el nombre del nuevo rotafolio.'); return; }
  if(state.galeriaCats.some(x => slugify(x.name) === slugify(name))){ alert('Ya existe un rotafolio con ese nombre (o uno casi igual).'); return; }
  state.galeriaCats = [...state.galeriaCats, { name, desc, cover:'' }];
  render();
  STORAGE.set('site:galeria-cats', state.galeriaCats);
};
window.__catDelete = function(i){
  const c = state.galeriaCats[i]; if(!c) return;
  if(rotafolioPhotos(c.name).length){ alert('Este rotafolio todavía tiene fotos. Elimínalas o muévelas a otro rotafolio (botón ✎, campo "Rotafolio") antes de borrarlo.'); return; }
  if(!confirm(`¿Eliminar el rotafolio "${c.name}"?`)) return;
  state.galeriaCats = state.galeriaCats.filter((_,j)=>j!==i);
  render();
  STORAGE.set('site:galeria-cats', state.galeriaCats);
};
window.__catCover = function(photoId){
  const p = state.galeria.find(x=>x.id===photoId); if(!p) return;
  const c = state.galeriaCats.find(x=>x.name===p.category); if(!c) return;
  c.cover = (c.cover === photoId) ? '' : photoId; // clic otra vez para quitarla
  render();
  STORAGE.set('site:galeria-cats', state.galeriaCats);
};

function findPhotoForEdit(scope, id, galleryId){
  if(scope==='portfolio') return state.portfolio.find(p=>p.id===id);
  if(scope==='galeria') return state.galeria.find(p=>p.id===id);
  const g = (state.galleries||[]).find(g=>g.id===galleryId);
  return g ? g.photos.find(p=>p.id===id) : null;
}

function openPhotoEditor(scope, id, galleryId){
  const original = findPhotoForEdit(scope, id, galleryId);
  if(!original) return;
  state.editingPhoto = {
    scope, galleryId,
    draft: { ...original, adjust: { ...(original.adjust || DEFAULT_ADJUST) } }
  };
  render();
}

window.__editorUpdateUrl = function(val){
  if(!state.editingPhoto) return;
  state.editingPhoto.draft.url = val;
  const img = document.getElementById('editor-preview-img');
  const status = document.getElementById('ep-url-status');
  if(status) status.innerHTML = '';

};
window.__editorImgError = function(){
  const status = document.getElementById('ep-url-status');
  if(status) status.innerHTML = '<p class="hint" style="color:#E06B5A;">Esta liga no está cargando. Si es de Google Drive, confirma que el archivo (no la carpeta) esté compartido como "Cualquier persona con el enlace". Si guardas así, la foto se verá rota en el sitio.</p>';
};
window.__editorImgOk = function(){
  const status = document.getElementById('ep-url-status');
  if(status) status.innerHTML = '';
};

window.__editorSlide = function(field, val){
  if(!state.editingPhoto) return;
  const num = parseInt(val,10);
  state.editingPhoto.draft.adjust[field] = num;
  const img = document.getElementById('editor-preview-img');
  if(img) img.style.filter = cssFilterFor(state.editingPhoto.draft);

window.__editorApplyPreset = function(key){
  if(!state.editingPhoto) return;
  const preset = FILTER_PRESETS[key];
  if(!preset) return;
  state.editingPhoto.draft.adjust = { ...preset.adjust };
  render();
};

/* =====================================================================
   DESCRIPCIONES AUTOMÁTICAS CON IA (Gemini, vía el backend seguro)
   -----------------------------------------------------------------
   El sitio nunca habla directo con Gemini — le pide al backend de
   Apps Script que lo haga, así la clave de Gemini nunca queda
   expuesta en el navegador de nadie.
   Esta función es SILENCIOSA (no muestra ventanas emergentes) para
   que se pueda usar en lote sobre muchas fotos sin interrumpir.
   ===================================================================== */
async function generateAiCaption(photoUrl){
  if(!STORAGE_AVAILABLE){
    return { error: 'Backend de Google Sheets no conectado.' };
  }
  try{
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'caption', url: normalizeImageUrl(photoUrl) || photoUrl, secret: APP_SECRET })
    });
    const data = await res.json();
    if(data.error) return { error: data.error };
    return { caption: (data.caption || '').trim() };
  } catch(e){
    console.error('Error generando descripción con IA:', e);
    return { error: 'No se pudo contactar al backend.' };
  }
}

window.__editorAutoCaption = async function(){
  const ep = state.editingPhoto;
  if(!ep) return;
  const status = document.getElementById('ep-caption-status');
  if(status) status.innerHTML = '<p class="hint">Generando descripción…</p>';
  const result = await generateAiCaption(ep.draft.url);
  if(!status) return; // el editor se cerró mientras esperábamos
  if(result.caption){
    status.innerHTML = '';
    document.getElementById('ep-caption').value = result.caption;
    ep.draft.caption = result.caption;
  } else {
    status.innerHTML = `<p class="hint" style="color:#E06B5A;">No se pudo generar: ${escapeHtml(result.error||'error desconocido')}</p>`;
  }
};

/* Construye la "referencia" que el backend usa para saber dónde guardar
   la descripción de vuelta: en qué foto, de qué galería (o del portafolio). */
function refFor(scope, photoId, galleryId){
  if(scope === 'portfolio') return `portfolio:${photoId}`;
  if(scope === 'galeria') return `galeria:${photoId}`;
  return `gallery:${galleryId}:${photoId}`;
}

/* Genera descripciones para todas las fotos de un contexto que aún no tienen una.
   VERDADERO segundo plano: el sitio solo le pide al backend que encole las fotos
   (un segundo) y el backend las procesa por su cuenta con un disparador de tiempo,
   una cada tanto — sigue trabajando aunque cierres el navegador por completo.
   Mientras tengas esta pestaña abierta, verás el progreso actualizarse solo. */
window.__autoCaptionAll = async function(scope, galleryId){
  if(state.captionJob){ alert('Ya hay una generación de descripciones en curso — espera a que termine antes de iniciar otra.'); return; }
  if(!STORAGE_AVAILABLE){ alert('Esto requiere el backend de Google Sheets conectado.'); return; }

  const photos = scope === 'portfolio' ? state.portfolio : scope === 'galeria' ? state.galeria : (state.galleries.find(g=>g.id===galleryId) || {photos:[]}).photos;
  const pending = photos.filter(p => !p.caption || !p.caption.trim());
  if(!pending.length){ alert('Todas las fotos de esta sección ya tienen descripción.'); return; }
  if(!confirm(`Se enviarán ${pending.length} foto(s) a un proceso en segundo plano en tu backend (a un ritmo de unas 3 por minuto, para no exceder los límites de Gemini). Puedes cerrar el sitio — seguirá trabajando solo. ¿Continuar?`)) return;

  const items = pending.map(p => ({ ref: refFor(scope, p.id, galleryId), url: normalizeImageUrl(p.url) || p.url }));

  let enqueueResult;
  try{
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'enqueueCaptions', items, secret: APP_SECRET })
    });
    enqueueResult = await res.json();
  } catch(e){
    alert('No se pudo iniciar el proceso: ' + e.message);
    return;
  }
  if(!enqueueResult || enqueueResult.error){
    alert('No se pudo iniciar el proceso: ' + (enqueueResult ? enqueueResult.error : 'error desconocido') + '\n\n¿Ya ejecutaste "configurarDisparadorDescripciones" una vez en tu Apps Script? Revisa la guía.');
    return;
  }

  state.captionJob = {
    batchId: enqueueResult.batchId,
    label: scope === 'portfolio' ? 'Portafolio' : scope === 'galeria' ? 'Galería' : 'Galería de cliente',
    scope, galleryId,
    total: enqueueResult.queued, done: 0, errors: 0
  };
  render();
  pollCaptionJob(); // empieza a consultar el progreso cada cierto tiempo
};

/* Mientras haya un trabajo en curso Y esta pestaña siga abierta, consulta el
   progreso cada 20 segundos para mantener la barra actualizada. El trabajo en
   sí NO depende de este sondeo — sigue corriendo en el backend aunque cierres
   la pestaña; esto es solo para que, si la dejas abierta, veas el avance. */
async function pollCaptionJob(){
  if(!state.captionJob) return;
  const { batchId } = state.captionJob;

  const check = async ()=>{
    if(!state.captionJob || state.captionJob.batchId !== batchId) return; // se canceló o cambió

    let status;
    try{
      const res = await fetch(`${API_URL}?action=captionQueueStatus&batchId=${encodeURIComponent(batchId)}&secret=${encodeURIComponent(APP_SECRET)}`);
      status = await res.json();
    } catch(e){ setTimeout(check, 20000); return; }

    if(!status || status.error){ setTimeout(check, 20000); return; }

    state.captionJob.done = status.done + status.errors;
    state.captionJob.errors = status.errors;
    updateCaptionJobStatusDom();

    if(status.pending > 0){
      setTimeout(check, 20000);
    } else {
      // Terminado: recarga los datos frescos desde la hoja (el backend ya escribió
      // las descripciones directo ahí) para reflejarlas en el panel.
      const summary = state.captionJob;
      state.captionJob = null;
      if(summary.scope === 'portfolio'){
        state.portfolio = (await STORAGE.get('site:portfolio')) || state.portfolio;
      } else if(summary.scope === 'galeria'){
        state.galeria = (await STORAGE.get('site:galeria')) || state.galeria;
      } else {
        const fresh = await STORAGE.get('gallery:' + summary.galleryId);
        if(fresh){
          const idx = state.galleries.findIndex(g => g.id === summary.galleryId);
          if(idx !== -1) state.galleries[idx] = fresh;
        }
      }
      state.saveMsg = `✨ Listo: ${status.done}/${summary.total} descripciones generadas${status.errors ? ` (${status.errors} con error)` : ''}`;
      render();
      setTimeout(()=>{ state.saveMsg=''; const el=document.querySelector('.save-msg'); if(el) el.textContent=''; }, 6000);
    }
  };
  check();
}

/* Actualiza solo el texto de la barra de progreso, sin re-renderizar todo el panel
   (evita interrumpir el scroll o los campos que el usuario esté llenando mientras
   la generación corre en segundo plano). */
function updateCaptionJobStatusDom(){
  const el = document.getElementById('caption-job-status');
  if(el && state.captionJob){
    const { label, done, total, errors } = state.captionJob;
    el.textContent = `✨ Generando descripciones (${label}): ${done}/${total}${errors ? ` · ${errors} con error` : ''} — puedes cerrar el sitio, sigue trabajando solo`;
  }
}

/* Si el admin vuelve a entrar al panel mientras un lote sigue pendiente de una
   sesión anterior, no hay forma de saberlo desde el navegador (no guardamos el
   batchId entre sesiones) — el trabajo igual sigue corriendo en el backend y
   las descripciones van apareciendo solas la próxima vez que abras cada galería. */

window.__editorSave = async function(){
  const ep = state.editingPhoto;
  if(!ep) return;
  const url = document.getElementById('ep-url').value.trim();
  const caption = document.getElementById('ep-caption').value.trim();
  const categoryEl = document.getElementById('ep-category');
  const category = categoryEl ? categoryEl.value.trim() : undefined;

  const updated = { ...ep.draft, url: normalizeImageUrl(url) || url, caption };
  if(category !== undefined) updated.category = category || 'General';

  if(ep.scope === 'portfolio'){
    state.portfolio = state.portfolio.map(p => p.id === updated.id ? updated : p);
    state.editingPhoto = null;
    render(); // optimista: se ve al instante
    STORAGE.set('site:portfolio', state.portfolio); // se guarda en segundo plano
  } else if(ep.scope === 'galeria'){
    state.galeria = state.galeria.map(p => p.id === updated.id ? updated : p);
    state.editingPhoto = null;
    render();
    STORAGE.set('site:galeria', state.galeria);
  } else {
    const g = (state.galleries||[]).find(g=>g.id===ep.galleryId);
    if(g){
      g.photos = g.photos.map(p => p.id === updated.id ? updated : p);
    }
    state.editingPhoto = null;
    render();
    if(g) STORAGE.set('gallery:'+g.id, g);
  }
};

/* ---------------------------- HELPERS ---------------------------- */
function escapeHtml(str){
  if(str===undefined || str===null) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function nl2br(str){ return escapeHtml(str).replace(/\n/g,'<br>'); }

/* ---------------------------- EVENTS ---------------------------- */
function bindActionListeners(root){
  root.querySelectorAll('[data-action]').forEach(el=>{
    el.addEventListener('click', onAction);
  });
}
function bindEvents(){
  const app = document.getElementById('app');
  bindActionListeners(app);
  if(state.view==='admin' && state.adminTab==='galerias'){
    ensureGalleriesLoaded();
  }
}

async function onAction(e){
  const action = e.currentTarget.dataset.action;
  const d = e.currentTarget.dataset;
  if(action && action.startsWith('go-') && e.currentTarget.tagName === 'A') e.preventDefault(); // enlaces que navegan dentro del sitio

  if(action==='go-galeria'){ navigate('galeria-hub'); return; }
  if(action==='go-rotafolio'){ navigate('galeria-cat', d.slug); return; }
  if(action==='rotafolio-more'){ state.rotafolioVisible[d.slug] = (state.rotafolioVisible[d.slug] || ROTAFOLIO_PAGE_SIZE) + ROTAFOLIO_PAGE_SIZE; render(); return; }
  if(action==='go-home'){
    navigate('public');
    if(d.anchor) setTimeout(()=>{ const el = document.getElementById(d.anchor); if(el) el.scrollIntoView({ behavior:'smooth' }); }, 60);
    return;
  }

  if(action==='go-admin'){
    history.pushState({}, '', '?admin');
    if(hasValidAdminSession()){ state.isAdmin = true; state.view = 'admin'; }
    else { state.view = 'admin-login'; }
    render();
  }
  if(action==='go-public'){ history.pushState({}, '', location.pathname); state.view='public'; render(); }
  if(action==='logout'){ state.isAdmin=false; clearAdminSession(); history.pushState({}, '', location.pathname); state.view='public'; render(); }

  if(action==='filter'){ state.activeFilter = d.cat; render(); }
  if(action==='open-lightbox'){ state.lightbox = parseInt(d.idx,10); render(); }
  if(action==='open-gallery-lightbox'){ state.lightbox = parseInt(d.idx,10); render(); }
  if(action==='close-lightbox' && e.target===e.currentTarget){ state.lightbox = null; render(); }
  if(action==='open-galeria-lightbox'){ state.lightboxG = parseInt(d.idx,10); render(); }
  if(action==='close-galeria-lightbox' && e.target===e.currentTarget){ state.lightboxG = null; render(); }

  if(action==='edit-photo'){ openPhotoEditor(d.scope, d.id, d.galleryId); }
  if(action==='close-editor' && e.target===e.currentTarget){ state.editingPhoto = null; render(); }

  if(action==='try-login'){
    const val = document.getElementById('admin-pass-input').value;
    if(!STORAGE_AVAILABLE){
      if(val === DEFAULT_PASSWORD){
        state.isAdmin = true; state.view = 'admin'; state.saveMsg = ''; saveAdminSession(); render();
        setTimeout(()=>alert('Modo sin guardado: todavía no conectaste el backend de Google Sheets, así que los cambios que hagas aquí no se guardarán. Sigue la guía "Backend con Google Sheets" para activarlo.'), 200);
      } else {
        document.getElementById('login-error').innerHTML = '<div class="error-msg">Contraseña incorrecta. (Todavía no conectaste el backend de guardado, así que solo se acepta la contraseña por defecto: admin123)</div>';
      }
      return;
    }
    const saved = await STORAGE.get('site:admin-pass');
    const enteredHash = await sha256(val);
    const savedHash = (saved && saved.hash) ? saved.hash : (saved && saved.value ? await sha256(saved.value) : null);
    if(savedHash && enteredHash === savedHash){
      state.isAdmin = true; state.view = 'admin'; saveAdminSession(); render();
    } else {
      document.getElementById('login-error').innerHTML = '<div class="error-msg">Contraseña incorrecta.</div>';
    }
  }

  if(action==='tab'){ state.adminTab = d.tab; render(); }

  if(action==='save-contenido'){
    const c = {
      heroTitle: document.getElementById('f-heroTitle').value,
      heroSubtitle: document.getElementById('f-heroSubtitle').value,
      heroImage: document.getElementById('f-heroImage').value,
      aboutTitle: document.getElementById('f-aboutTitle').value,
      aboutText: document.getElementById('f-aboutText').value,
      aboutImage: document.getElementById('f-aboutImage').value,
      contactEmail: document.getElementById('f-contactEmail').value,
      instagram: document.getElementById('f-instagram').value,
      calendlyLink: document.getElementById('f-calendlyLink').value
    };
    state.content = c;
    flashSave(); // se ve "Guardado" al instante
    STORAGE.set('site:content', c); // se guarda en segundo plano, sin bloquear la interfaz
  }

  if(action==='set-font'){
    state.design = {...state.design, font:d.key}; applyDesign(state.design); render();
    STORAGE.set('site:design', state.design);
  }
  if(action==='set-color'){
    state.design = {...state.design, color:d.key}; applyDesign(state.design); render();
    STORAGE.set('site:design', state.design);
  }

  if(action==='add-photo'){
    const category = document.getElementById('np-category').value.trim() || 'General';
    const urlsRaw = document.getElementById('np-urls').value.split('\n').map(l=>l.trim()).filter(Boolean);
    const fileInput = document.getElementById('np-file');
    const files = Array.from(fileInput.files || []);

    if(!urlsRaw.length && !files.length){ alert('Pega al menos una liga o selecciona al menos un archivo.'); return; }

    const newPhotos = [];
    for(const raw of urlsRaw){
      newPhotos.push({ id: uid(), url: normalizeImageUrl(raw), category, caption: '', adjust: {...DEFAULT_ADJUST} });
    }
    const up = await uploadFilesWithProgress(files, ['EstudioFoto', 'Portafolio']);
    if(up === null) return;
    up.items.forEach(it => newPhotos.push({ id: uid(), url: it.url, category, caption: '', adjust: {...DEFAULT_ADJUST} }));

    state.portfolio = [...state.portfolio, ...newPhotos];
    render(); // se ven al instante en la lista, todas juntas
    if(files.length){
      await saveAndFinish(()=>STORAGE.set('site:portfolio', state.portfolio, true, true), newPhotos.length, up.failed, up.expired);
    } else {
      STORAGE.set('site:portfolio', state.portfolio);
    }
  }

  if(action==='delete-photo'){
    state.portfolio = state.portfolio.filter(p=>p.id!==d.id);
    render();
    STORAGE.set('site:portfolio', state.portfolio);
  }

  if(action==='add-galeria-photo'){
    const category = document.getElementById('ng2-category').value;
    const urlsRaw = document.getElementById('ng2-urls').value.split('\n').map(l=>l.trim()).filter(Boolean);
    const fileInput = document.getElementById('ng2-file');
    const files = Array.from(fileInput.files || []);

    if(!urlsRaw.length && !files.length){ alert('Pega al menos una liga o selecciona al menos un archivo.'); return; }

    const newPhotos = [];
    for(const raw of urlsRaw){
      newPhotos.push({ id: uid(), url: normalizeImageUrl(raw), category, caption: '', adjust: {...DEFAULT_ADJUST} });
    }
    const up = await uploadFilesWithProgress(files, ['EstudioFoto', 'Galería']);
    if(up === null) return;
    up.items.forEach(it => newPhotos.push({ id: uid(), url: it.url, category, caption: '', adjust: {...DEFAULT_ADJUST} }));

    state.galeria = [...state.galeria, ...newPhotos];
    render(); // se ven al instante en la lista, todas juntas
    if(files.length){
      await saveAndFinish(()=>STORAGE.set('site:galeria', state.galeria, true, true), newPhotos.length, up.failed, up.expired);
    } else {
      STORAGE.set('site:galeria', state.galeria);
    }
  }

  if(action==='delete-galeria-photo'){
    state.galeria = state.galeria.filter(p=>p.id!==d.id);
    render();
    STORAGE.set('site:galeria', state.galeria);
  }

  if(action==='create-gallery'){
    if(state.creatingGallery) return; // evita crear dos veces si se hace doble clic
    const name = document.getElementById('ng-name').value.trim();
    const months = parseInt(document.getElementById('ng-duration').value,10);
    if(!name){ alert('Ponle un nombre a la galería.'); return; }
    state.creatingGallery = true;
    const id = uid();
    const now = new Date();
    const gallery = {
      id, name,
      createdAt: now.toISOString(),
      expiresAt: addMonths(now, months).toISOString(),
      durationMonths: months,
      photos: []
    };
    state.galleries = [...(state.galleries||[]), gallery]; // caché local: no hace falta re-descargar todo
    document.getElementById('ng-name').value = '';
    renderGalleriesList(); // se ve al instante
    try{
      await STORAGE.set('gallery:' + id, gallery);
      await STORAGE.appendToIndex('galleries:index', id); // atómico: no puede pisarse con otra creación simultánea
    } finally {
      state.creatingGallery = false;
    }
  }


  if(action==='change-pass'){
    const val = document.getElementById('f-newpass').value;
    if(!val || val.length<4){ alert('Usa al menos 4 caracteres.'); return; }
    await STORAGE.set('site:admin-pass', { hash: await sha256(val) });
    document.getElementById('f-newpass').value='';
    flashSave();
  }
}

function flashSave(){
  state.saveMsg = 'Guardado ✓';
  render();
  setTimeout(()=>{ state.saveMsg=''; const el=document.querySelector('.save-msg'); if(el) el.textContent=''; }, 2000);
}

async function fileToCompressedDataUrl(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 1400;
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width*scale; canvas.height = img.height*scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* =====================================================================
   MÓDULO GOOGLE DRIVE (Camino 3) — conexión, carpetas y subida directa
   ===================================================================== */
let driveTokenClient = null;

function driveConnected(){ return !!state.driveToken; }

window.__connectDrive = async function(){
  if(!DRIVE_ENABLED){
    alert('Todavía no configuraste tu Client ID de Google Drive. Sigue la guía "camino3-google-drive.md", sección "Paso 3", y pégalo en la línea DRIVE_CLIENT_ID del archivo.');
    return;
  }
  if(typeof google === 'undefined' || !google.accounts || !google.accounts.oauth2){
    try{ await loadScriptOnce('https://accounts.google.com/gsi/client'); }
    catch(e){ alert('No se pudo cargar el inicio de sesión de Google. Revisa tu conexión e intenta de nuevo.'); return; }
  }
  if(!driveTokenClient){
    driveTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: DRIVE_CLIENT_ID,
      scope: DRIVE_SCOPE,
      callback: (resp)=>{
        if(resp && resp.access_token){
          state.driveToken = resp.access_token;
          render();
        } else {
          alert('No se pudo conectar con Google Drive. Intenta de nuevo.');
        }
      }
    });
  }
  driveTokenClient.requestAccessToken();
};

window.__disconnectDrive = function(){
  if(state.driveToken && typeof google !== 'undefined' && google.accounts){
    google.accounts.oauth2.revoke(state.driveToken, ()=>{});
  }
  state.driveToken = null;
  render();
};

let pickerApiLoaded = false;
async function ensurePickerApiLoaded(callback){
  if(pickerApiLoaded){ callback(); return; }
  if(typeof gapi === 'undefined'){
    try{ await loadScriptOnce('https://apis.google.com/js/api.js'); }
    catch(e){ alert('No se pudo cargar el selector de Google Drive. Revisa tu conexión e intenta de nuevo.'); return; }
  }
  gapi.load('picker', { callback: ()=>{ pickerApiLoaded = true; callback(); } });

window.__openDrivePicker = function(targetType, targetId){
  if(!PICKER_ENABLED){
    alert('Todavía no configuraste tu Clave de API para el selector de Drive. Sigue la guía "picker-y-ia.md" y pégala en la línea PICKER_API_KEY del archivo.');
    return;
  }
  if(!driveConnected()){
    alert('Primero conecta Google Drive (botón arriba en el panel) para poder elegir fotos desde ahí.');
    return;
  }
  ensurePickerApiLoaded(()=> showDrivePicker(targetType, targetId));

function showDrivePicker(targetType, targetId){
  const view = new google.picker.DocsView(google.picker.ViewId.DOCS_IMAGES)
    .setIncludeFolders(true)
    .setSelectFolderEnabled(false); // navega carpetas, pero selecciona fotos, no la carpeta misma
  const picker = new google.picker.PickerBuilder()
    .addView(view)
    .setOAuthToken(state.driveToken)
    .setDeveloperKey(PICKER_API_KEY)
    .enableFeature(google.picker.Feature.MULTISELECT_ENABLED)
    .setCallback((data)=> onDrivePickerResult(data, targetType, targetId))
    .build();
  picker.setVisible(true);
}

async function onDrivePickerResult(data, targetType, targetId){
  if(data.action !== google.picker.Action.PICKED) return;
  const docs = data.docs || [];
  if(!docs.length) return;

  progressStart(`Preparando ${docs.length} foto(s) de Drive…`);
  progressUpdate(0, docs.length);
  const shareResults = await runPool(docs, async (doc)=>{
    const res = await fetch(`https://www.googleapis.com/drive/v3/files/${doc.id}/permissions`, {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + state.driveToken, 'Content-Type': 'application/json' },
      body: JSON.stringify({ role: 'reader', type: 'anyone' })
    });
    // fetch() NO lanza error por un 403 — hay que revisar res.ok explícitamente
    if(!res.ok){ console.error('Drive rechazó compartir', doc.name, res.status); throw new Error(res.status === 401 ? 'SESION_DRIVE_EXPIRADA' : String(res.status)); }
    return true;
  }, 5, (d,t)=>progressUpdate(d, t, `Compartiendo ${d} de ${t}`));

  const newEntries = [];
  const shareFailed = [];
  let expired = false;
  docs.forEach((doc,i)=>{
    if(!shareResults[i].ok){
      shareFailed.push(doc.name);
      if(shareResults[i].error && shareResults[i].error.message === 'SESION_DRIVE_EXPIRADA') expired = true;
    }
    newEntries.push({ id: uid(), url: `https://drive.google.com/thumbnail?id=${doc.id}&sz=w2000`, caption: '', adjust: {...DEFAULT_ADJUST} });
  });

  let saveFn;
  if(targetType === 'portfolio'){
    const categoryEl = document.getElementById('np-category');
    const category = (categoryEl && categoryEl.value.trim()) || 'General';
    newEntries.forEach(p => p.category = category);
    state.portfolio = [...state.portfolio, ...newEntries];
    render();
    saveFn = ()=>STORAGE.set('site:portfolio', state.portfolio, true, true);
  } else if(targetType === 'galeria'){
    const categoryEl = document.getElementById('ng2-category');
    const category = (categoryEl && categoryEl.value) || (galeriaCatNames()[0] || 'General');
    newEntries.forEach(p => p.category = category);
    state.galeria = [...state.galeria, ...newEntries];
    render();
    saveFn = ()=>STORAGE.set('site:galeria', state.galeria, true, true);
  } else if(targetType === 'gallery'){
    const g = state.galleries.find(g => g.id === targetId);
    if(!g){ progressFinish('Error', 'No se encontró la galería.'); return; }
    g.photos.push(...newEntries);
    render();
    saveFn = ()=>STORAGE.set('gallery:' + targetId, g, true, true);
  } else { progressFinish('Error', 'Destino desconocido.'); return; }

  const note = shareFailed.length
    ? `\n\n⚠ Google no dejó compartir públicamente ${shareFailed.length} foto(s) (posiblemente no eres el propietario original, o viven en una carpeta compartida). NO se verán hasta que las compartas a mano en Drive: selecciónalas → Compartir → "Cualquier persona con el enlace" → Lector.\nArchivos: ${shareFailed.slice(0,8).join(', ')}${shareFailed.length>8?` … y ${shareFailed.length-8} más`:''}` + (expired ? '\n\nTu conexión con Drive expiró (dura ~1 hora): vuelve a conectar.' : '')
    : '';
  await saveAndFinish(saveFn, newEntries.length, [], false, note);
}

/* Agrega todas las fotos de una carpeta de Drive pegando su liga. El backend lee la carpeta. */
window.__addFolder = async function(targetType, targetId){
  if(!STORAGE_AVAILABLE){ alert('Esto requiere el backend de Google Sheets conectado.'); return; }
  const ids = targetType === 'portfolio' ? ['np-folder','np-folder-sub']
            : targetType === 'galeria' ? ['ng2-folder','ng2-folder-sub']
            : [`gp-folder-${targetId}`, `gp-folder-sub-${targetId}`];
  const inputEl = document.getElementById(ids[0]);
  const recursive = !!(document.getElementById(ids[1]) && document.getElementById(ids[1]).checked);
  const raw = inputEl ? inputEl.value.trim() : '';
  const m = raw.match(/folders\/([a-zA-Z0-9_-]+)/) || raw.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if(!m){ alert('Pega la liga de una CARPETA de Google Drive (se ve como drive.google.com/drive/folders/…).'); return; }

  progressStart('Leyendo la carpeta de Drive…');
  progressUpdate(0, 0, 'Buscando fotos… en carpetas grandes puede tardar hasta un minuto.');
  const pctEl = document.getElementById('prog-pct'); if(pctEl) pctEl.textContent = '…';

  let data;
  try{
    const res = await fetch(API_URL, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action:'listFolder', folderId: m[1], recursive, share: true, secret: APP_SECRET })
    });
    data = await res.json();
  } catch(e){
    progressFinish('No se pudo leer la carpeta', 'No se pudo contactar al backend: ' + e.message);
    return;
  }
  if(!data || data.error){
    progressFinish('No se pudo leer la carpeta', (data && data.error ? data.error : 'Respuesta inesperada.') +
      '\n\n¿Ya republicaste el backend y ejecutaste "autorizarDrive" una vez en Apps Script? Revisa las instrucciones.');
    return;
  }

  // Destino y fotos que ya estaban (para no duplicar si repites la importación)
  let existing, category;
  if(targetType === 'portfolio'){
    existing = state.portfolio;
    const c = document.getElementById('np-category'); category = (c && c.value.trim()) || 'General';
  } else if(targetType === 'galeria'){
    existing = state.galeria;
    const c = document.getElementById('ng2-category'); category = (c && c.value) || (galeriaCatNames()[0] || 'General');
  } else {
    const g = (state.galleries||[]).find(g=>g.id===targetId);
    if(!g){ progressFinish('Error', 'No se encontró la galería.'); return; }
    existing = g.photos;
  }
  const have = new Set(existing.map(p => fileIdFromDriveUrl(p.url || '')).filter(Boolean));
  const fresh = data.files.filter(f => !have.has(f.id));
  const dupes = data.files.length - fresh.length;

  if(!fresh.length){
    progressFinish('No hay fotos nuevas', data.files.length ? `La carpeta "${data.name}" tiene ${data.files.length} foto(s), pero todas ya estaban agregadas.` : `No se encontraron fotos en la carpeta "${data.name}".` + (!recursive ? '\n\nSi las fotos están en subcarpetas, marca "Incluir también las fotos de las subcarpetas".' : ''));
    return;
  }
  const ov = document.getElementById('prog-overlay'); if(ov) ov.style.display = 'none'; // oculto mientras se confirma
  if(!confirm(`En la carpeta "${data.name}" se encontraron ${fresh.length} foto(s) nuevas${dupes?` (${dupes} ya estaban agregadas y se omiten)`:''}. ¿Agregarlas?`)){
    if(ov) ov.remove(); return;
  }
  if(ov) ov.style.display = '';
  progressUpdate(0, 0, 'Preparando…', 'Agregando fotos…');

  const entries = fresh.map(f => ({ id: uid(), url: `https://drive.google.com/thumbnail?id=${f.id}&sz=w2000`, caption: '', adjust: {...DEFAULT_ADJUST} }));
  if(category !== undefined) entries.forEach(p => p.category = category);

  // Verifica que la primera foto realmente se vea (detecta carpetas que Google no dejó compartir)
  const visible = await new Promise(resolve => {
    const img = new Image(); const t = setTimeout(()=>resolve(false), 10000);
    img.onload = ()=>{ clearTimeout(t); resolve(true); };
    img.onerror = ()=>{ clearTimeout(t); resolve(false); };
    img.src = entries[0].url;
  });

  let saveFn;
  if(targetType === 'portfolio'){
    state.portfolio = [...state.portfolio, ...entries]; render();
    saveFn = ()=>STORAGE.set('site:portfolio', state.portfolio, true, true);
  } else if(targetType === 'galeria'){
    state.galeria = [...state.galeria, ...entries]; render();
    saveFn = ()=>STORAGE.set('site:galeria', state.galeria, true, true);
  } else {
    const g = state.galleries.find(g=>g.id===targetId);
    g.photos.push(...entries); render();
    saveFn = ()=>STORAGE.set('gallery:'+targetId, g, true, true);
  }

  let note = '';
  if(data.truncated) note += '\n\n⚠ La carpeta es muy grande y solo se leyó una parte. Vuelve a pegar la misma liga y se agregarán las que faltan (las ya agregadas se omiten).';
  if(data.skipped) note += `\n\nSe omitieron ${data.skipped} foto(s) en formato HEIC/HEIF, que los navegadores no pueden mostrar (expórtalas a JPG).`;
  if(!visible || (data.sharing && data.sharing.indexOf('error') === 0)){
    note += '\n\n⚠ Puede que estas fotos no se vean todavía: Google no dejó compartir la carpeta automáticamente' + (data.sharing && data.sharing.indexOf('error')===0 ? ` (${data.sharing})` : '') + '. En Drive, abre la carpeta → Compartir → "Cualquier persona con el enlace" → Lector.';
  }
  await saveAndFinish(saveFn, entries.length, [], false, note);
};

/* Busca (o crea) una carpeta de Drive con ese nombre dentro de un padre dado */
async function getOrCreateDriveFolder(name, parentId){
  const safeName = name.replace(/'/g, "\\'");
  let q = `name='${safeName}' and mimeType='application/vnd.google-apps.folder' and trashed=false`;
  if(parentId) q += ` and '${parentId}' in parents`;
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id,name)`, {
    headers: { Authorization: 'Bearer ' + state.driveToken }
  });
  const data = await res.json();
  if(data.files && data.files.length) return data.files[0].id;

  const createRes = await fetch('https://www.googleapis.com/drive/v3/files', {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + state.driveToken, 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, mimeType: 'application/vnd.google-apps.folder', parents: parentId ? [parentId] : undefined })
  });
  const created = await createRes.json();
  if(!created.id) throw new Error('No se pudo crear la carpeta "' + name + '" en Drive.');
  return created.id;
}

/* Crea (o encuentra) una ruta de carpetas anidadas, ej. ['EstudioFoto','Portafolio'] */
async function ensureDriveFolderPath(names){
  let parentId = null;
  for(const name of names){
    parentId = await getOrCreateDriveFolder(name, parentId);
  }
  return parentId;
}

/* Sube un archivo a una carpeta de Drive, lo hace visible por liga, y regresa su URL para mostrar */
async function uploadFileToDriveFolder(file, folderId){
  const base64Data = await new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });

  const boundary = 'estudiofoto-' + uid();
  const metadata = { name: file.name, parents: [folderId] };
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: ${file.type || 'image/jpeg'}\r\nContent-Transfer-Encoding: base64\r\n\r\n${base64Data}\r\n` +
    `--${boundary}--`;

  const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + state.driveToken, 'Content-Type': 'multipart/related; boundary=' + boundary },
    body
  });
  if(res.status === 401){ state.driveToken = null; throw new Error('SESION_DRIVE_EXPIRADA'); }
  const created = await res.json();
  if(!created.id) throw new Error('Drive no aceptó el archivo "' + file.name + '".');

  // Hacerlo visible por liga (solo lectura), igual que "Cualquier persona con el enlace"
  const permRes = await fetch(`https://www.googleapis.com/drive/v3/files/${created.id}/permissions`, {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + state.driveToken, 'Content-Type': 'application/json' },
    body: JSON.stringify({ role: 'reader', type: 'anyone' })
  });
  if(!permRes.ok){
    console.error('Drive no dejó compartir', file.name, permRes.status, await permRes.text());
    // Esto es raro para archivos creados por el propio sitio (normalmente sí se puede),
    // pero lo dejamos avisado en la consola por si acaso; la foto se guarda igual.
  }

  return `https://drive.google.com/thumbnail?id=${created.id}&sz=w2000`;
}

/* Sube un archivo usando Drive si está conectado; si no, cae de vuelta al modo local comprimido */
const _folderCache = {};
async function smartUploadFile(file, folderPathNames){
  if(driveConnected()){
    // Sin respaldo local: si falla, se lanza el error y quien llama lo reporta al final
    // (guardar cientos de fotos como datos locales rompería el sitio).
    const cacheKey = folderPathNames.join('/');
    if(!_folderCache[cacheKey]) _folderCache[cacheKey] = ensureDriveFolderPath(folderPathNames).catch(e=>{ delete _folderCache[cacheKey]; throw e; });
    const folderId = await _folderCache[cacheKey];
    return await uploadFileToDriveFolder(file, folderId);
  }
  return await fileToCompressedDataUrl(file);
}
